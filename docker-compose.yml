services:
  statisfy:
    # L'image publiée sur GHCR est réservée à un usage optionnel : par défaut on
    # construit depuis les sources (`build: .`). La publication de l'image se
    # fait uniquement à la main (workflow « Docker » → Run workflow).
    # Pour utiliser l'image publiée, décommentez la ligne ci-dessous.
    # image: ${STATISFY_IMAGE:-ghcr.io/lolo1580/statisfy:latest}
    build: .
    container_name: statisfy
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Connexion PostgreSQL. Le mot de passe est repris de POSTGRES_PASSWORD
      # (voir le service `db`) : préférez un mot de passe sans caractère à
      # encoder dans une URL (`@`, `:`, `/`, `%`, `#`).
      DATABASE_URL: "postgresql://${POSTGRES_USER:-statisfy}:${POSTGRES_PASSWORD:?Renseignez POSTGRES_PASSWORD dans .env}@db:5432/${POSTGRES_DB:-statisfy}"
      SESSION_SECRET: "${SESSION_SECRET:?Renseignez SESSION_SECRET dans .env}"
      CREDENTIALS_KEY: "${CREDENTIALS_KEY:?Renseignez CREDENTIALS_KEY dans .env}"
      NEXT_PUBLIC_APP_NAME: "${NEXT_PUBLIC_APP_NAME:-Statisfy}"
      ALLOW_REGISTRATION: "${ALLOW_REGISTRATION:-true}"
      SPOTIFY_CLIENT_ID: "${SPOTIFY_CLIENT_ID:-}"
      SPOTIFY_CLIENT_SECRET: "${SPOTIFY_CLIENT_SECRET:-}"
      SPOTIFY_REDIRECT_URI: "${SPOTIFY_REDIRECT_URI:-}"
      APP_URL: "${APP_URL:-}"
      COOKIE_DOMAIN: "${COOKIE_DOMAIN:-}"
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-true}"
      SYNC_TOKEN: "${SYNC_TOKEN:-}"
      SYNC_MIN_INTERVAL_MS: "${SYNC_MIN_INTERVAL_MS:-120000}"
      BACKUP_DIR: "/backups"
      BACKUP_KEEP: "${BACKUP_KEEP:-7}"
      LOG_RETENTION_DAYS: "${LOG_RETENTION_DAYS:-90}"
      LOG_SINK: "${LOG_SINK:-}"
      LOG_SINK_URL: "${LOG_SINK_URL:-}"
      LOG_SINK_HEADERS: "${LOG_SINK_HEADERS:-}"
      LOG_SINK_INDEX: "${LOG_SINK_INDEX:-statisfy-logs}"
      LOG_SINK_LABELS: "${LOG_SINK_LABELS:-}"
      LOG_SINK_FILE: "${LOG_SINK_FILE:-}"
      LOG_SINK_FILE_MAX_MB: "${LOG_SINK_FILE_MAX_MB:-10}"
      LOG_SINK_FILE_FORMAT: "${LOG_SINK_FILE_FORMAT:-json}"
      LOG_SINK_HOST: "${LOG_SINK_HOST:-}"
      LOG_SINK_PORT: "${LOG_SINK_PORT:-}"
      LOG_SINK_TLS: "${LOG_SINK_TLS:-false}"
      LOG_SINK_TLS_REJECT_UNAUTHORIZED: "${LOG_SINK_TLS_REJECT_UNAUTHORIZED:-true}"
      LOG_SINK_TLS_CA: "${LOG_SINK_TLS_CA:-}"
      LOG_SINK_MIN_LEVEL: "${LOG_SINK_MIN_LEVEL:-info}"
      LOG_SINK_HOSTNAME: "${LOG_SINK_HOSTNAME:-}"
      LOG_SINK_TIMEOUT_MS: "${LOG_SINK_TIMEOUT_MS:-2000}"
    volumes:
      - ./backups:/backups
      # Sortie du sink `file` (lisible par l'agent Wazuh sur l'hôte).
      - ./logs:/logs

  # Base de données PostgreSQL. Les données sont persistées dans le volume `pgdata`.
  db:
    image: postgres:18-alpine
    container_name: statisfy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-statisfy}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Renseignez POSTGRES_PASSWORD dans .env}"
      POSTGRES_DB: "${POSTGRES_DB:-statisfy}"
    volumes:
      # PostgreSQL 18 stocke ses données dans un sous-dossier versionné :
      # on monte le dossier parent.
      - pgdata:/var/lib/postgresql
    # Exposé uniquement en local, pour le développement hors Docker
    # (`pnpm dev` avec DATABASE_URL vers localhost). Changez `POSTGRES_PORT`
    # si le port 5432 est déjà pris sur l'hôte.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-statisfy} -d $${POSTGRES_DB:-statisfy}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Synchronisation périodique (toutes les 2 min) + sauvegarde (toutes les 6 h).
  # Nécessite SYNC_TOKEN dans .env.
  cron:
    image: curlimages/curl:latest
    container_name: statisfy-cron
    restart: unless-stopped
    depends_on:
      - statisfy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'i=0; while true; do curl -sf -X POST -H "Authorization: Bearer $$SYNC_TOKEN" http://statisfy:3000/api/sync > /dev/null || true; if [ $$((i % 180)) -eq 0 ]; then curl -sf -X POST -H "Authorization: Bearer $$SYNC_TOKEN" http://statisfy:3000/api/backup > /dev/null || true; fi; i=$$((i+1)); sleep 120; done'
    environment:
      SYNC_TOKEN: "${SYNC_TOKEN:-}"

volumes:
  pgdata:
