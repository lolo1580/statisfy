name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Le build n'ouvre pas la base : il faut juste que DATABASE_URL soit
      # défini (le client Prisma est instancié à l'import).
      DATABASE_URL: "postgresql://statisfy:statisfy@localhost:5432/statisfy"
      SESSION_SECRET: "ci-session-secret"
      CREDENTIALS_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: statisfy
          POSTGRES_PASSWORD: statisfy
          POSTGRES_DB: statisfy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U statisfy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        # Échoue sur toute vulnérabilité « high » ou « critical » parmi les
        # dépendances de production (les overrides `pnpm-workspace.yaml` doivent
        # rester à jour).
        run: pnpm audit --prod --audit-level high

      - name: Validate Prisma schema
        # Applique les migrations sur la base vide du service, puis vérifie
        # qu'aucune dérive ne subsiste entre les migrations et `schema.prisma`.
        run: |
          pnpm db:migrate
          pnpm exec prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

  # Tests de bout en bout : crée une base dédiée (`statisfy_e2e`), la migre,
  # lance le serveur de développement et vérifie les parcours critiques.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://statisfy:statisfy@localhost:5432/statisfy"
      E2E_DATABASE_URL: "postgresql://statisfy:statisfy@localhost:5432/statisfy_e2e"

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: statisfy
          POSTGRES_PASSWORD: statisfy
          POSTGRES_DB: statisfy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U statisfy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Construit l'image Docker **et la démarre** contre une base Postgres, puis
  # vérifie que l'app répond. Attrape deux classes de pannes qu'un simple
  # `pnpm build` ne voit pas :
  #  - build Docker cassé (contexte manquant, ex. dossier `public/` non versionné) ;
  #  - démarrage/entrypoint cassé (schéma, migrations, variables d'env requises).
  docker:
    name: Docker image (build + smoke test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: statisfy
          POSTGRES_PASSWORD: statisfy
          POSTGRES_DB: statisfy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U statisfy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t statisfy-ci .

      - name: Run container and smoke test
        run: |
          set -e
          docker run -d --name statisfy-ci --network host \
            -e DATABASE_URL="postgresql://statisfy:statisfy@localhost:5432/statisfy" \
            -e SESSION_SECRET="ci-session-secret-ci-session-secret-0123456789" \
            -e CREDENTIALS_KEY="AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" \
            statisfy-ci
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/login; then
              echo "OK : /login répond 200"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' statisfy-ci 2>/dev/null)" != "true" ]; then
              echo "Le conteneur s'est arrêté avant de répondre."
              break
            fi
            sleep 2
          done
          echo "--- journaux du conteneur ---"
          docker logs statisfy-ci || true
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f statisfy-ci || true

  # Vérifie la **mise à niveau** : on crée une base avec le schéma de la release
  # précédente (tag le plus proche), puis on démarre la nouvelle image dessus.
  # Attrape les régressions « vieille instance -> nouvelle version » (colonnes /
  # tables manquantes) que le smoke test sur base vide ne voit pas.
  upgrade:
    name: Upgrade from previous release schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: statisfy
          POSTGRES_PASSWORD: statisfy
          POSTGRES_DB: statisfy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U statisfy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://statisfy:statisfy@localhost:5432/statisfy"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Previous release tag
        id: prev
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"
          if [ -n "$PREV" ]; then echo "Release précédente : $PREV"; else echo "Aucun tag : test ignoré"; fi

      - name: Setup pnpm
        if: steps.prev.outputs.tag != ''
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.prev.outputs.tag != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.prev.outputs.tag != ''
        run: pnpm install --frozen-lockfile

      - name: Create database with the previous schema
        if: steps.prev.outputs.tag != ''
        run: |
          git show "${{ steps.prev.outputs.tag }}:prisma/schema.prisma" > /tmp/old-schema.prisma
          pnpm exec prisma migrate diff --from-empty --to-schema /tmp/old-schema.prisma --script > /tmp/old-schema.sql
          # `db execute` lit l'URL depuis prisma.config.ts / DATABASE_URL (pas de --url).
          pnpm exec prisma db execute --stdin < /tmp/old-schema.sql

      - name: Build image
        if: steps.prev.outputs.tag != ''
        run: docker build -t statisfy-ci .

      - name: Run new image against the old database (smoke test)
        if: steps.prev.outputs.tag != ''
        run: |
          set -e
          docker run -d --name statisfy-upgrade --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e SESSION_SECRET="ci-session-secret-ci-session-secret-0123456789" \
            -e CREDENTIALS_KEY="AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" \
            statisfy-ci
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/login; then
              echo "OK : mise à niveau depuis ${{ steps.prev.outputs.tag }} réussie"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' statisfy-upgrade 2>/dev/null)" != "true" ]; then
              echo "Le conteneur s'est arrêté avant de répondre."
              break
            fi
            sleep 2
          done
          echo "--- journaux du conteneur ---"
          docker logs statisfy-upgrade || true
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f statisfy-upgrade || true
