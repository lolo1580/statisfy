name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Le build n'ouvre pas la base : il faut juste que DATABASE_URL soit
      # défini (le client Prisma est instancié à l'import).
      DATABASE_URL: "postgresql://statisfy:statisfy@localhost:5432/statisfy"
      SESSION_SECRET: "ci-session-secret"
      CREDENTIALS_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: statisfy
          POSTGRES_PASSWORD: statisfy
          POSTGRES_DB: statisfy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U statisfy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        # Échoue sur toute vulnérabilité « high » ou « critical » parmi les
        # dépendances de production (les overrides `pnpm-workspace.yaml` doivent
        # rester à jour).
        run: pnpm audit --prod --audit-level high

      - name: Validate Prisma schema
        run: pnpm db:push

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
