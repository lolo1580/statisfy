name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Le build n'ouvre pas la base : il faut juste que DATABASE_URL soit
      # défini (le client Prisma est instancié à l'import).
      DATABASE_URL: "postgresql://statisfy:statisfy@localhost:5432/statisfy"
      SESSION_SECRET: "ci-session-secret"
      CREDENTIALS_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: statisfy
          POSTGRES_PASSWORD: statisfy
          POSTGRES_DB: statisfy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U statisfy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        # Échoue sur toute vulnérabilité « high » ou « critical » parmi les
        # dépendances de production (les overrides `pnpm-workspace.yaml` doivent
        # rester à jour).
        run: pnpm audit --prod --audit-level high

      - name: Validate Prisma schema
        run: pnpm db:push

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Construit l'image Docker **et la démarre** contre une base Postgres, puis
  # vérifie que l'app répond. Attrape deux classes de pannes qu'un simple
  # `pnpm build` ne voit pas :
  #  - build Docker cassé (contexte manquant, ex. dossier `public/` non versionné) ;
  #  - démarrage/entrypoint cassé (schéma, migrations, variables d'env requises).
  docker:
    name: Docker image (build + smoke test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: statisfy
          POSTGRES_PASSWORD: statisfy
          POSTGRES_DB: statisfy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U statisfy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t statisfy-ci .

      - name: Run container and smoke test
        run: |
          set -e
          docker run -d --name statisfy-ci --network host \
            -e DATABASE_URL="postgresql://statisfy:statisfy@localhost:5432/statisfy" \
            -e SESSION_SECRET="ci-session-secret-ci-session-secret-0123456789" \
            -e CREDENTIALS_KEY="AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" \
            statisfy-ci
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/login; then
              echo "OK : /login répond 200"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' statisfy-ci 2>/dev/null)" != "true" ]; then
              echo "Le conteneur s'est arrêté avant de répondre."
              break
            fi
            sleep 2
          done
          echo "--- journaux du conteneur ---"
          docker logs statisfy-ci || true
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f statisfy-ci || true

