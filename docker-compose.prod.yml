# ─────────────────────────────────────────────────────────────────────────────
# Statisfy — production
#
# Utilise l'image publiée sur GHCR (aucun build). Par défaut l'image est
# épinglée sur une version ; surchargez-la avec STATISFY_IMAGE.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Variables attendues dans .env (voir .env.example) :
#   SESSION_SECRET, CREDENTIALS_KEY, POSTGRES_PASSWORD  (obligatoires)
#   APP_URL, SPOTIFY_*, SYNC_TOKEN, BACKUP_KEEP, ALLOW_REGISTRATION…
#
# Pour construire depuis les sources en local, utilisez `docker-compose.yml`.
# ─────────────────────────────────────────────────────────────────────────────
services:
  statisfy:
    image: ${STATISFY_IMAGE:-ghcr.io/lolo1580/statisfy:1.0.1}
    container_name: statisfy
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Connexion PostgreSQL (le mot de passe est repris de POSTGRES_PASSWORD).
      DATABASE_URL: "postgresql://${POSTGRES_USER:-statisfy}:${POSTGRES_PASSWORD:?Renseignez POSTGRES_PASSWORD dans .env}@db:5432/${POSTGRES_DB:-statisfy}"
      SESSION_SECRET: "${SESSION_SECRET:?Renseignez SESSION_SECRET dans .env}"
      CREDENTIALS_KEY: "${CREDENTIALS_KEY:?Renseignez CREDENTIALS_KEY dans .env}"
      NEXT_PUBLIC_APP_NAME: "${NEXT_PUBLIC_APP_NAME:-Statisfy}"
      ALLOW_REGISTRATION: "${ALLOW_REGISTRATION:-true}"
      SPOTIFY_CLIENT_ID: "${SPOTIFY_CLIENT_ID:-}"
      SPOTIFY_CLIENT_SECRET: "${SPOTIFY_CLIENT_SECRET:-}"
      SPOTIFY_REDIRECT_URI: "${SPOTIFY_REDIRECT_URI:-}"
      APP_URL: "${APP_URL:-}"
      COOKIE_DOMAIN: "${COOKIE_DOMAIN:-}"
      SYNC_TOKEN: "${SYNC_TOKEN:-}"
      SYNC_MIN_INTERVAL_MS: "${SYNC_MIN_INTERVAL_MS:-120000}"
      BACKUP_DIR: "/backups"
      BACKUP_KEEP: "${BACKUP_KEEP:-7}"
    ports:
      # Exposé en local uniquement : placez un reverse proxy (HTTPS) devant.
      # Si votre proxy est un conteneur sur un autre réseau Docker, remplacez
      # cette ligne par `- "3000:3000"` ou partagez un réseau commun.
      - "${STATISFY_BIND:-127.0.0.1}:3000:3000"
    volumes:
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  # Base de données PostgreSQL. Données persistées dans le volume `pgdata`.
  db:
    image: postgres:18-alpine
    container_name: statisfy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-statisfy}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Renseignez POSTGRES_PASSWORD dans .env}"
      POSTGRES_DB: "${POSTGRES_DB:-statisfy}"
    volumes:
      # PostgreSQL 18 stocke ses données dans un sous-dossier versionné :
      # on monte le dossier parent.
      - pgdata:/var/lib/postgresql
    # Pas de port publié en production. Pour la migration initiale depuis
    # l'hôte, décommentez temporairement (accès local seulement) :
    # ports:
    #   - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-statisfy} -d $${POSTGRES_DB:-statisfy}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  # Synchronisation périodique (toutes les 2 min) + sauvegarde (toutes les 6 h).
  # Nécessite SYNC_TOKEN dans .env.
  cron:
    image: curlimages/curl:latest
    container_name: statisfy-cron
    restart: unless-stopped
    depends_on:
      statisfy:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'i=0; while true; do curl -sf -X POST -H "Authorization: Bearer $$SYNC_TOKEN" http://statisfy:3000/api/sync > /dev/null || true; if [ $$((i % 180)) -eq 0 ]; then curl -sf -X POST -H "Authorization: Bearer $$SYNC_TOKEN" http://statisfy:3000/api/backup > /dev/null || true; fi; i=$$((i+1)); sleep 120; done'
    environment:
      SYNC_TOKEN: "${SYNC_TOKEN:-}"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  pgdata:
