allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
  # Pair optionnel de `prisma`/`@prisma/client` : non utilisé (driver adapter-pg),
  # mais présent dans le graphe de dépendances.
  better-sqlite3: true
  unrs-resolver: true

# Correctifs de sécurité : ces paquets ne sont tirés que par le CLI Prisma
# (transitifs) et sont épinglés à des versions vulnérables par Prisma 7.10.
# On force les versions corrigées compatibles.
overrides:
  "lodash@<4.18.1": "4.18.1"
  "mysql2@<3.23.1": "3.24.5"
  "deepmerge-ts@<8.0.0": "8.0.2"

